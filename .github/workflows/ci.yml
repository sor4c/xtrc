# @trace SPEC-CI-VERIFY, SPEC-CI-PERF, REQ-CI-VERIFY, REQ-CI-PERF, REQ-NFR-PERF, US-CICD-01, US-PERF-01
name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  verify:
    name: Quality Gates & Traceability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run strict linter diagnostics (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run automated test and NFR benchmark suite (cargo test)
        run: cargo test --all-targets --all-features

      - name: Verify repository bidirectional traceability (xtrc check --strict)
        run: cargo run --locked -- check --strict

      - name: Measure CLI performance and enforce NFR SLA budgets (scripts/measure-perf.sh)
        run: bash scripts/measure-perf.sh dist/perf-report.json

      - name: Upload CI performance measurement report
        uses: actions/upload-artifact@v4
        with:
          name: xtrc-ci-perf-report
          path: dist/perf-report.json
          if-no-files-found: error

