# @trace SPEC-CI-VERIFY, SPEC-CI-PERF, REQ-CI-VERIFY, REQ-CI-PERF, REQ-NFR-PERF, US-CICD-01, US-PERF-01
name: Verify

on:
  push:
    branches:
      - "**"
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  verify:
    name: Quality Gates & Traceability Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run strict linter diagnostics (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run automated test and NFR benchmark suite (cargo test)
        run: cargo test --all-targets --all-features

      - name: Verify repository bidirectional traceability (xtrc check --strict)
        run: cargo run --locked -- check --strict

      - name: Measure CLI performance and enforce NFR SLA budgets (scripts/measure-perf.sh)
        run: bash scripts/measure-perf.sh dist/perf-report.json

      - name: Upload CI performance measurement report
        uses: actions/upload-artifact@v4
        with:
          name: xtrc-ci-perf-report
          path: dist/perf-report.json
          if-no-files-found: error

  platform-build:
    name: Native Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify native target and build release binary
        shell: bash
        run: |
          rustc -vV | grep -Fx "host: ${{ matrix.target }}"
          cargo build --release --locked

      - name: Smoke-test native binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            XTRC="target/release/xtrc.exe"
          else
            XTRC="target/release/xtrc"
          fi
          "${XTRC}" --version
          "${XTRC}" --root examples/demo check --strict
