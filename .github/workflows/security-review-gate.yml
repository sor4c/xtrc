# @trace SPEC-CI-VERIFY, REQ-CI-VERIFY
name: Security Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  security-review-findings:
    name: Publish trusted Advanced Security status
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' &&
       github.ref == 'refs/heads/main' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/security-check ') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    concurrency:
      group: trusted-ghas-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          requested_sha="${PR_EVENT_HEAD_SHA}"
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${COMMENT_BODY}" =~ ^/security-check[[:space:]]+([0-9a-f]{40})$ ]]; then
              requested_sha="${BASH_REMATCH[1]}"
            else
              requested_sha=""
            fi
          fi
          if [[ "${requested_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha=${requested_sha}" >>"${GITHUB_OUTPUT}"
          fi
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "A numeric PR_NUMBER is required." >&2
            exit 2
          fi
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid pull request head SHA." >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >>"${GITHUB_OUTPUT}"
          if [[ "${EVENT_NAME}" == "issue_comment" && ! "${requested_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A /security-check comment must include the current 40-character PR head SHA." >&2
            exit 1
          fi
          if [[ "${head_sha}" != "${requested_sha}" ]]; then
            echo "The pull request head changed or could not be verified; refusing to pass." >&2
            exit 1
          fi

      - name: Set trusted status pending on pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state=pending \
            -f context="Trusted Advanced Security Review Findings" \
            -f description="Checking unresolved GitHub Advanced Security findings" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check for unresolved Advanced Security findings
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash scripts/check-unresolved-security-findings.sh

      - name: Publish trusted status result on pull request head
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "${SCAN_OUTCOME}" == "success" ]]; then
            state=success
            description="No unresolved GitHub Advanced Security findings"
          else
            state=failure
            description="Unresolved or unverifiable GitHub Advanced Security findings"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f "state=${state}" \
            -f context="Trusted Advanced Security Review Findings" \
            -f "description=${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
