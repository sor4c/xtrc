# @trace SPEC-CI-VERIFY, REQ-CI-VERIFY
name: Security Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  security-review-findings:
    name: Trusted Advanced Security Review Findings
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check for unresolved Advanced Security findings
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/check-unresolved-security-findings.sh
