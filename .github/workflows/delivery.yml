# @trace SPEC-CD-DELIVERY, SPEC-VER-POLICY, SPEC-CI-PERF, REQ-PKG-DIST, REQ-PKG-SBOM, REQ-CD-MAIN, REQ-VER-POLICY, REQ-CI-PERF, REQ-NFR-PERF
name: Head-of-Main Delivery

concurrency:
  group: delivery-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify All Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run strict linter diagnostics (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run automated test and NFR benchmark suite (cargo test)
        run: cargo test --all-targets --all-features

      - name: Verify repository bidirectional traceability (xtrc check --strict)
        run: cargo run --locked -- check --strict

      - name: Measure CLI performance and enforce NFR SLA budgets (scripts/measure-perf.sh)
        run: bash scripts/measure-perf.sh dist/perf-report.json

  deliver:
    name: Build Package, SPDX SBOM & Publish Delivery
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history for version policy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Debian packaging tool (cargo-deb)
        run: cargo install cargo-deb --locked

      - name: Compute unique delivery version and build release binary
        run: |
          VERSION="$(bash scripts/compute-version.sh)"
          echo "XTRC_DELIVERY_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          XTRC_DELIVERY_VERSION="${VERSION}" cargo build --release --locked
          ./target/release/xtrc --version | grep -F "xtrc ${VERSION}"

      - name: Measure release binary performance and verify NFR SLA fulfillment
        run: |
          bash scripts/measure-perf.sh dist/perf-report.json ./target/release/xtrc
          jq -e '.status == "pass" and (.benchmarks | length >= 5) and (.benchmarks | all(.passed == true))' dist/perf-report.json >/dev/null

      - name: Generate SPDX 2.3 JSON SBOM and package deliverables
        run: |
          VERSION="${XTRC_DELIVERY_VERSION}"
          TARGET="x86_64-unknown-linux-gnu"
          STAGE_DIR="dist/xtrc-v${VERSION}-${TARGET}"
          mkdir -p "${STAGE_DIR}"

          # 1. Generate SPDX 2.3 JSON SBOM stamped with unique delivery version (Requirements 3 & Version Policy)
          bash scripts/generate-sbom.sh dist/xtrc.spdx.json "${VERSION}"
          jq -e --arg ver "${VERSION}" '.spdxVersion == "SPDX-2.3" and (.packages | any(.name == "xtrc" and .versionInfo == $ver)) and (.relationships | length > 0)' dist/xtrc.spdx.json >/dev/null

          # 2. Build Debian package (.deb) stamped with unique delivery version (Requirements 1 & 3)
          cargo deb --no-build --deb-version "${VERSION}" --output "dist/xtrc_${VERSION}_amd64.deb"

          # 3. Build portable binary archive (.tar.gz) including SPDX SBOM (Requirements 1 & 3)
          cp target/release/xtrc "${STAGE_DIR}/xtrc"
          cp README.md "${STAGE_DIR}/README.md"
          if [ -f LICENSE ]; then cp LICENSE "${STAGE_DIR}/LICENSE"; fi
          cp dist/xtrc.spdx.json "${STAGE_DIR}/xtrc.spdx.json"
          tar -C dist -czf "dist/xtrc-v${VERSION}-${TARGET}.tar.gz" "xtrc-v${VERSION}-${TARGET}"
          # Also emit a version-agnostic alias for binstall and release consumers
          cp "dist/xtrc-v${VERSION}-${TARGET}.tar.gz" "dist/xtrc-${TARGET}.tar.gz"
          rm -rf "${STAGE_DIR}"

          # 4. Generate Homebrew Formula package (xtrc.rb) pinned to immutable release tag v${VERSION} (Requirement 1)
          bash scripts/generate-homebrew-formula.sh "${VERSION}" "dist/xtrc-v${VERSION}-${TARGET}.tar.gz" "dist/xtrc.rb" "${GITHUB_REPOSITORY:-sor4c/xtrc}" "v${VERSION}"

          # 5. Generate SHA-256 checksums for all delivery artifacts
          (cd dist && sha256sum xtrc.spdx.json perf-report.json xtrc.rb *.deb *.tar.gz > SHA256SUMS)

      - name: Upload head-of-main delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xtrc-${{ env.XTRC_DELIVERY_VERSION }}-delivery
          path: |
            dist/xtrc.spdx.json
            dist/perf-report.json
            dist/xtrc.rb
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish immutable versioned GitHub Release and update main-head pointer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${XTRC_DELIVERY_VERSION}"
          VERSION_TAG="v${VERSION}"
          TITLE="xtrc ${VERSION}"
          NOTES="Automated delivery for version \`${VERSION}\` (commit \`${GITHUB_SHA}\`). Includes Homebrew formula (\`xtrc.rb\`), Debian package (\`xtrc_${VERSION}_amd64.deb\`), prebuilt Linux binary archive (\`xtrc-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz\`), \`SHA256SUMS\`, CI/CD performance SLA report (\`perf-report.json\`), and SPDX 2.3 JSON SBOM (\`xtrc.spdx.json\`)."

          IS_PRERELEASE="--prerelease"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE=""
          fi

          # 1. Create immutable versioned release v<VERSION> (never overwrite an existing version tag)
          if gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Error: Release '${VERSION_TAG}' already exists. Refusing to overwrite an immutable versioned delivery." >&2
            exit 1
          fi
          gh release create "${VERSION_TAG}" dist/xtrc.spdx.json dist/perf-report.json dist/xtrc.rb dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${GITHUB_SHA}" \
            ${IS_PRERELEASE}

          # 2. Refresh rolling 'main-head' convenience release so it contains only the current version's artifacts on main
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if gh release view "main-head" >/dev/null 2>&1; then
              gh release delete "main-head" --yes --cleanup-tag
            fi
            gh release create "main-head" dist/xtrc.spdx.json dist/perf-report.json dist/xtrc.rb dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
              --title "xtrc Head-of-Main (${VERSION})" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}" \
              --prerelease
          fi

